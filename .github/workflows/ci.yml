name: CI

on:
  push:
    branches: [main]
    paths:
      - app.py
      - requirements.txt
      - Dockerfile
      - .github/workflows/ci.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Build image
        run: docker build -t url-shortener:${{ github.sha }} .
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: url-shortener:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        run: |
          docker tag url-shortener:${{ github.sha }} ghcr.io/jxcarter92/url-shortener:${{ github.sha }}
          docker push ghcr.io/jxcarter92/url-shortener:${{ github.sha }}

      - name: Commit and push new image tag
        run: |
          sed -i "s|ghcr.io/jxcarter92/url-shortener:.*|ghcr.io/jxcarter92/url-shortener:${{ github.sha }}|" deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment.yaml
          git commit -m "Deploy ${{ github.sha }}"
          git push

